[package]
name = "anahata"
version = "0.1.0"
edition = "2021"
authors = ["Anāhata Developers"]
description = "Desktop and Android frontend shell for Anāhata"

[dependencies]
anahata-audio = { path = "../crates/anahata-audio" }
anahata-player = { path = "../crates/anahata-player" }
anahata-library = { path = "../crates/anahata-library" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"
thiserror = "1.0"
